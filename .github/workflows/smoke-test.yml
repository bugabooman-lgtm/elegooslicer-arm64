name: Smoke test (launch on clean Ubuntu ARM64)

# Downloads a published ARM64 AppImage, installs only the packages listed in
# TABLET_SETUP.md into a clean Ubuntu container, launches ElegooSlicer on a virtual
# screen and saves a screenshot. Mimics the tablet's Termux + Ubuntu setup.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to test (e.g. v1.5.3.5)"
        required: true
        default: "v1.5.3.5"

permissions:
  contents: write   # to push screenshots to the smoke-results branch

jobs:
  smoke:
    runs-on: ubuntu-24.04-arm
    container: ubuntu:24.04
    timeout-minutes: 30
    steps:
      - name: Install runtime packages (same list as TABLET_SETUP.md) + test tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y wget ca-certificates \
            libgtk-3-0t64 libwebkit2gtk-4.1-0 libgl1 libegl1 libopengl0 libglu1-mesa libwayland-egl1 \
            libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 gstreamer1.0-plugins-good \
            libsecret-1-0 libsm6 libice6 libxkbcommon0 libdbus-1-3 libmspack0t64 fonts-noto-core locales \
            dbus-x11 xvfb x11-apps imagemagick git
          locale-gen en_US.UTF-8

      - name: Download and unpack AppImage
        run: |
          v=${{ inputs.version }}
          wget -q -O ElegooSlicer.AppImage \
            "https://github.com/${{ github.repository }}/releases/download/${v}-arm64/ElegooSlicer-${v}-aarch64.AppImage"
          chmod +x ElegooSlicer.AppImage
          ./ElegooSlicer.AppImage --appimage-extract > /dev/null
          ls squashfs-root

      - name: Check for missing libraries
        run: |
          export LD_LIBRARY_PATH="$PWD/squashfs-root/bin:$PWD/squashfs-root/lib"
          ldd squashfs-root/bin/elegoo-slicer | grep "not found" && exit 1 || echo "All libraries found"

      - name: Launch on virtual screen and take screenshots
        run: |
          export LANG=en_US.UTF-8 LIBGL_ALWAYS_SOFTWARE=1 HOME=/root
          mkdir -p "$HOME/.config"
          Xvfb :99 -screen 0 1600x1000x24 &
          sleep 2
          export DISPLAY=:99
          dbus-launch --exit-with-session ./squashfs-root/AppRun > slicer.log 2>&1 &
          for t in 30 60 90; do
            sleep 30
            xwd -root -silent | convert xwd:- "shot-${t}s.png" || true
          done
          echo "--- still running?"; pgrep -a elegoo-slicer || echo "NOT RUNNING (crashed or exited)"
          echo "--- last 80 log lines"; tail -n 80 slicer.log

      - name: Push screenshots and log to smoke-results branch
        if: always()
        run: |
          mkdir -p results && cp shot-*.png slicer.log results/ 2>/dev/null || true
          cd results
          git init -q -b smoke-results
          git config user.name "smoke-test" && git config user.email "actions@github.com"
          git add -A && git commit -qm "Smoke test ${{ inputs.version }} run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" smoke-results

      - name: Upload screenshots and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: |
            shot-*.png
            slicer.log
